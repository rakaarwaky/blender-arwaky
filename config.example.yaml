# Blender Arwaky Configuration — Example Template
#
# Copy this file to `config.yaml` and adjust for your environment:
#   cp config.example.yaml config.yaml
#
# All paths may use environment variable expansion via ${VAR:-default} syntax.

blender:
  # Path to the Blender executable
  # Override with BLENDER_EXECUTABLE env var, or set in this file.
  executable_path: "${BLENDER_EXECUTABLE:-/usr/bin/blender}"
  # Override for Windows:  executable_path: "C:/Program Files/Blender Foundation/Blender/blender.exe"
  # Override for macOS:    executable_path: "/Applications/Blender.app/Contents/MacOS/Blender"
  # Host and port for the Blender socket server
  host: "localhost"
  port: 9876

server:
  # Host and port for the MCP server (if using SSE)
  host: "127.0.0.1"
  port: 9877
  # Log configuration
  log_dir: "log"
  log_file: "blender_run.log"
  # Transport mode: stdio or sse
  transport: "stdio"

hunyuan:
  # URL of the Hunyuan 3D API service
  api_url: "http://localhost:8081"

storage:
  # Base directory for temporary files (override per OS as needed)
  temp_dir: "/tmp/blender-mcp"
  # Specific directory for Polyhaven downloads
  polyhaven_dir: "/tmp/polyhaven"

telemetry:
  # Enable anonymous telemetry (disabled by default — opt-in)
  enabled: false
  # Directory to store telemetry data (UUID, etc.)
  # If null, defaults to OS-specific data directory
  data_dir: null
