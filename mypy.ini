[mypy]
python_version = 3.13
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_any_unimported = False
check_untyped_defs = True
strict_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
# Advisory type-check configuration for the current package layout.
# CI uses Ruff, syntax compilation, and pytest as the mandatory static/runtime gates.
files = modules, blender_mcp_addon
mypy_path = .
exclude = (^|/)(tests|dist|build)/
explicit_package_bases = True
ignore_missing_imports = True

# Blender bpy module uses dynamic types that can't be fully validated
[mypy-bpy]
ignore_missing_imports = True

[mypy-bpy.*]
ignore_missing_imports = True

[mypy-mathutils]
ignore_missing_imports = True

[mypy-mathutils.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True
