    priority: 5
    path: "/home/raka/mcp-arwaky/blender-arwaky/modules/launcher"
  - name: "cli"
    priority: 6
    path: "/home/raka/mcp-arwaky/blender-arwaky/modules/cli"
  - name: "mcp"
    priority: 7
    path: "/home/raka/mcp-arwaky/blender-arwaky/modules/mcp"
  - name: "job"
    priority: 8
    path: "/home/raka/mcp-arwaky/blender-arwaky/modules/job"
  - name: "asset"
