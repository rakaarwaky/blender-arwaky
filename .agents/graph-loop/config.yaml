# GRAPH LOOP ENGINE — Project Configuration
# ═══════════════════════════════════════════════════════════════════
# Only project-specific values. Everything else is hardcoded.

# ── Project Root ────────────────────────────────────────────────────
project_root: "/home/raka/mcp-arwaky/blender-arwaky"

